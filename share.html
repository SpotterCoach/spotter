<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Trainingsplan</title>
<style>
  :root {
    --bg: #f4f5f7; --card: #ffffff; --ink: #14161a; --muted: #6a707a;
    --accent: #2f6bff; --accent-ink: #ffffff; --line: #e3e6ea;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #101215; --card: #1a1d22; --ink: #f1f3f6; --muted: #9aa1ab; --accent: #6b95ff; --accent-ink: #0b1020; --line: #2a2e35; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 560px; margin: 0 auto; padding: 24px 16px 48px; }
  .eyebrow { color: var(--muted); font-size: 13px; letter-spacing: .04em; text-transform: uppercase; margin: 0 0 4px; }
  h1 { font-size: 26px; line-height: 1.2; margin: 0 0 4px; word-break: break-word; }
  .meta { color: var(--muted); margin: 0 0 20px; }
  ol { list-style: none; margin: 0; padding: 0; background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
  li { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-top: 1px solid var(--line); }
  li:first-child { border-top: 0; }
  .num { flex: none; width: 28px; height: 28px; border-radius: 50%; background: var(--bg); color: var(--muted); display: grid; place-items: center; font-size: 13px; font-weight: 600; }
  .name { flex: 1; min-width: 0; word-break: break-word; }
  .name small { display: block; color: var(--muted); font-size: 13px; }
  .scheme { flex: none; font-weight: 600; white-space: nowrap; }
  .actions { display: grid; gap: 10px; margin-top: 24px; }
  a.btn, button.btn {
    display: block; text-align: center; text-decoration: none; cursor: pointer;
    padding: 14px 16px; border-radius: 14px; font: inherit; font-weight: 600;
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
  }
  a.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
  .hint { color: var(--muted); font-size: 14px; margin-top: 16px; }
  .error { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 20px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <section id="plan" hidden>
    <p class="eyebrow">Geteilter Trainingsplan</p>
    <h1 id="title"></h1>
    <p class="meta" id="meta"></p>
    <ol id="list"></ol>
    <div class="actions">
      <a class="btn primary" id="open-app" href="#">In der App öffnen</a>
      <button class="btn" id="copy" type="button">Plan als Text kopieren</button>
    </div>
    <p class="hint">Du hast die App nicht? Kein Problem – alle Übungen siehst du direkt hier.</p>
  </section>

  <section id="error" class="error" hidden>
    <h1>Link ungültig</h1>
    <p class="meta">Dieser Trainingsplan konnte nicht gelesen werden. Bitte lass dir den Link noch einmal schicken – oft wurde er beim Kopieren abgeschnitten.</p>
  </section>
</main>

<script>
(function () {
  var APP_SCHEME = "com.example.fitnessapp://plan";

  function fromBase64Url(s) {
    s = s.replace(/-/g, "+").replace(/_/g, "/");
    while (s.length % 4) s += "=";
    var bin = atob(s), bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes;
  }

  // Same limits as PlanShare.kt in the app: a tiny crafted link must not be able to inflate into
  // something huge and freeze the tab.
  var MAX_TOKEN_CHARS = 100000;
  var MAX_DECODED_BYTES = 256 * 1024;

  // Plans are zlib-compressed (java.util.zip.Deflater) before being base64url-encoded.
  async function inflate(bytes) {
    var stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate"));
    var reader = stream.getReader(), chunks = [], total = 0;
    for (;;) {
      var part = await reader.read();
      if (part.done) break;
      total += part.value.length;
      if (total > MAX_DECODED_BYTES) { reader.cancel(); throw new Error("too big"); }
      chunks.push(part.value);
    }
    var all = new Uint8Array(total), offset = 0;
    chunks.forEach(function (chunk) { all.set(chunk, offset); offset += chunk.length; });
    return new TextDecoder().decode(all);
  }

  function show(id) { document.getElementById(id).hidden = false; }

  function render(plan, token) {
    var exercises = plan.e.slice(0, 100);
    var planName = String(plan.n).slice(0, 80);
    document.title = planName + " – Trainingsplan";
    document.getElementById("title").textContent = planName;
    var totalSets = exercises.reduce(function (sum, e) { return sum + (e.s | 0); }, 0);
    document.getElementById("meta").textContent =
      exercises.length + (exercises.length === 1 ? " Übung" : " Übungen") + " · " + totalSets + " Sätze";

    var list = document.getElementById("list");
    exercises.forEach(function (e, i) {
      var li = document.createElement("li");
      var num = document.createElement("span"); num.className = "num"; num.textContent = i + 1;
      var name = document.createElement("span"); name.className = "name"; name.textContent = e.m || e.i;
      if (e.u) { var small = document.createElement("small"); small.textContent = "einseitig"; name.appendChild(small); }
      var scheme = document.createElement("span"); scheme.className = "scheme"; scheme.textContent = (e.s | 0) + " × " + (e.r | 0);
      li.append(num, name, scheme);
      list.appendChild(li);
    });

    document.getElementById("open-app").href = APP_SCHEME + "#" + token;

    document.getElementById("copy").addEventListener("click", function () {
      var text = planName + "\n" + exercises.map(function (e, i) {
        return (i + 1) + ". " + (e.m || e.i) + " – " + (e.s | 0) + " × " + (e.r | 0) + (e.u ? " (einseitig)" : "");
      }).join("\n");
      var btn = this;
      (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(function () {
        btn.textContent = "Kopiert ✓";
      }, function () { btn.textContent = "Kopieren nicht möglich"; });
    });

    show("plan");
  }

  async function main() {
    var token = location.hash.slice(1);
    if (!token || token.length > MAX_TOKEN_CHARS || !/^[A-Za-z0-9_-]+$/.test(token)) return show("error");
    try {
      var plan = JSON.parse(await inflate(fromBase64Url(token)));
      if (!plan || typeof plan.n !== "string" || !Array.isArray(plan.e) || !plan.e.length) throw new Error("bad plan");
      render(plan, token);
    } catch (err) {
      show("error");
    }
  }
  main();
})();
</script>
</body>
</html>
